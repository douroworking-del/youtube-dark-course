    // ========== UTILITÁRIOS ==========
    const STORAGE_KEY = "yt-dark-course-progress";

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { completed: [], currentModule: "mod1" };
      } catch {
        return { completed: [], currentModule: "mod1" };
      }
    }

    function saveProgress(progress) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }

    // ========== COMPONENTES ==========
    function toPascal(str) {
      return str.split("-").map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join("");
    }

    function Icon({ name, size = 20, className = "" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = "";
          const pascal = toPascal(name);
          const iconNode = window.lucide.icons[pascal] || window.lucide[pascal] || window.lucide.icons.Circle || window.lucide.Circle;
          if (!iconNode) return;
          const icon = window.lucide.createElement(iconNode);
          icon.setAttribute("width", size);
          icon.setAttribute("height", size);
          if (className) icon.setAttribute("class", className);
          ref.current.appendChild(icon);
        }
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" />;
    }

    function Toast({ message, onClose }) {
      useEffect(() => {
        const t = setTimeout(onClose, 2200);
        return () => clearTimeout(t);
      }, [onClose]);
      return (
        <div className="fixed bottom-6 right-6 z-50 toast-enter">
          <div className="flex items-center gap-3 bg-zinc-800 border border-zinc-700 text-zinc-100 px-4 py-3 rounded-xl shadow-2xl">
            <Icon name="check-circle" size={18} className="text-cyan-400" />
            <span className="text-sm font-medium">{message}</span>
          </div>
        </div>
      );
    }

    function CopyButton({ text }) {
      const [copied, setCopied] = useState(false);
      const handleCopy = async () => {
        try {
          await navigator.clipboard.writeText(text);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (e) {
          console.error(e);
        }
      };
      return (
        <button
          onClick={handleCopy}
          className="flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-lg bg-zinc-700 hover:bg-zinc-600 text-zinc-200 transition-colors"
        >
          <Icon name={copied ? "check" : "copy"} size={14} />
          {copied ? "Copiado!" : "Copiar Prompt"}
        </button>
      );
    }

    function PromptBlock({ title, code }) {
      return (
        <div className="my-6 rounded-xl border border-zinc-700 overflow-hidden bg-zinc-900/80">
          <div className="flex items-center justify-between px-4 py-2.5 bg-zinc-800/80 border-b border-zinc-700">
            <span className="text-sm font-medium text-zinc-300 flex items-center gap-2">
              <Icon name="terminal" size={16} className="text-cyan-400" />
              {title}
            </span>
            <CopyButton text={code} />
          </div>
          <pre className="p-4 text-sm text-zinc-300 overflow-x-auto whitespace-pre-wrap font-mono leading-relaxed">
            {code}
          </pre>
        </div>
      );
    }

    function DataTable({ title, headers, rows }) {
      return (
        <div className="my-6">
          {title && <h3 className="text-lg font-semibold text-zinc-200 mb-3">{title}</h3>}
          <div className="overflow-x-auto rounded-xl border border-zinc-700">
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-zinc-800/90">
                  {headers.map((h, i) => (
                    <th key={i} className="px-4 py-3 text-left font-semibold text-zinc-200 whitespace-nowrap">
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((row, ri) => (
                  <tr key={ri} className={ri % 2 === 0 ? "bg-zinc-900/50" : "bg-zinc-900/20"}>
                    {row.map((cell, ci) => (
                      <td key={ci} className="px-4 py-3 text-zinc-300 border-t border-zinc-800">
                        {cell}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function RPMCalculator() {
      const [views, setViews] = useState(10000);
      const [rpm, setRpm] = useState(12);
      const revenue = ((views / 1000) * rpm).toFixed(2);

      return (
        <div className="my-6 p-5 rounded-xl border border-cyan-500/30 bg-gradient-to-br from-zinc-900 to-zinc-900/50">
          <h3 className="text-lg font-semibold text-zinc-100 mb-1 flex items-center gap-2">
            <Icon name="calculator" size={20} className="text-cyan-400" />
            Calculadora de Receita Estimada (RPM)
          </h3>
          <p className="text-sm text-zinc-400 mb-5">Views × (RPM / 1000) = Receita estimada</p>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
            <div>
              <label className="block text-xs font-medium text-zinc-400 mb-1.5">Visualizações</label>
              <input
                type="number"
                min="0"
                value={views}
                onChange={(e) => setViews(Number(e.target.value) || 0)}
                className="w-full px-3 py-2.5 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-cyan-500/50"
              />
            </div>
            <div>
              <label className="block text-xs font-medium text-zinc-400 mb-1.5">RPM (R$ por 1.000 views)</label>
              <input
                type="number"
                min="0"
                step="0.5"
                value={rpm}
                onChange={(e) => setRpm(Number(e.target.value) || 0)}
                className="w-full px-3 py-2.5 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-cyan-500/50"
              />
            </div>
          </div>

          <div className="flex items-center justify-between p-4 rounded-lg bg-zinc-800/80 border border-zinc-700">
            <span className="text-zinc-400 text-sm">Receita estimada</span>
            <span className="text-2xl font-bold text-cyan-400">R$ {Number(revenue).toLocaleString("pt-BR", { minimumFractionDigits: 2 })}</span>
          </div>
          <p className="text-xs text-zinc-500 mt-3">
            * Valores aproximados. RPM real varia por nicho, país do público e temporada.
          </p>
        </div>
      );
    }

    function ProgressBar({ completed, total }) {
      const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
      return (
        <div className="w-full">
          <div className="flex justify-between text-xs text-zinc-400 mb-1.5">
            <span>Progresso</span>
            <span>{pct}%</span>
          </div>
          <div className="h-2 rounded-full bg-zinc-800 overflow-hidden">
            <div
              className="h-full rounded-full bg-gradient-to-r from-red-600 to-cyan-500 transition-all duration-500"
              style={{ width: `${pct}%` }}
            />
          </div>
        </div>
      );
    }

    function Sidebar({ modules, currentId, completed, onSelect, progressPct }) {
      return (
        <aside className="hidden lg:flex flex-col w-72 shrink-0 border-r border-zinc-800 bg-zinc-900/50 sticky top-0 h-screen">
          <div className="p-5 border-b border-zinc-800">
            <div className="flex items-center gap-2.5 mb-1">
              <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-red-600 to-red-700 flex items-center justify-center">
                <Icon name="play" size={18} className="text-white" />
              </div>
              <div>
                <h1 className="font-bold text-sm leading-tight text-zinc-100">YouTube Dark</h1>
                <p className="text-[11px] text-zinc-500">Curso Interativo</p>
              </div>
            </div>
            <div className="mt-4">
              <ProgressBar completed={completed.length} total={modules.length} />
            </div>
          </div>

          <nav className="flex-1 overflow-y-auto scrollbar-thin p-3 space-y-1">
            {modules.map((mod) => {
              const isActive = mod.id === currentId;
              const isDone = completed.includes(mod.id);
              return (
                <button
                  key={mod.id}
                  onClick={() => onSelect(mod.id)}
                  className={`w-full flex items-start gap-3 px-3 py-3 rounded-xl text-left transition-all ${
                    isActive
                      ? "bg-zinc-800 border border-zinc-700 shadow-sm"
                      : "hover:bg-zinc-800/60 border border-transparent"
                  }`}
                >
                  <div
                    className={`mt-0.5 w-7 h-7 rounded-lg flex items-center justify-center shrink-0 ${
                      isDone
                        ? "bg-cyan-500/20 text-cyan-400"
                        : isActive
                        ? "bg-red-600/20 text-red-400"
                        : "bg-zinc-800 text-zinc-500"
                    }`}
                  >
                    {isDone ? (
                      <Icon name="check" size={14} />
                    ) : (
                      <span className="text-xs font-bold">{mod.number}</span>
                    )}
                  </div>
                  <div className="min-w-0">
                    <p className={`text-sm font-medium truncate ${isActive ? "text-zinc-100" : "text-zinc-300"}`}>
                      {mod.shortTitle}
                    </p>
                    <p className="text-[11px] text-zinc-500 mt-0.5 line-clamp-1">{mod.description}</p>
                  </div>
                </button>
              );
            })}
          </nav>

          <div className="p-4 border-t border-zinc-800 text-center">
            <p className="text-[11px] text-zinc-600">Progresso salvo automaticamente</p>
          </div>
        </aside>
      );
    }

    function MobileNav({ modules, currentId, completed, onSelect, open, setOpen }) {
      return (
        <>
          <header className="lg:hidden sticky top-0 z-40 bg-zinc-950/95 backdrop-blur border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-red-600 to-red-700 flex items-center justify-center">
                <Icon name="play" size={16} className="text-white" />
              </div>
              <span className="font-bold text-sm">YouTube Dark</span>
            </div>
            <button
              onClick={() => setOpen(!open)}
              className="p-2 rounded-lg hover:bg-zinc-800"
            >
              <Icon name={open ? "x" : "menu"} size={20} />
            </button>
          </header>

          {open && (
            <div className="lg:hidden fixed inset-0 z-30 bg-zinc-950/80" onClick={() => setOpen(false)}>
              <div
                className="absolute top-14 left-0 right-0 bg-zinc-900 border-b border-zinc-800 p-3 space-y-1 max-h-[70vh] overflow-y-auto"
                onClick={(e) => e.stopPropagation()}
              >
                {modules.map((mod) => {
                  const isActive = mod.id === currentId;
                  const isDone = completed.includes(mod.id);
                  return (
                    <button
                      key={mod.id}
                      onClick={() => {
                        onSelect(mod.id);
                        setOpen(false);
                      }}
                      className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-left ${
                        isActive ? "bg-zinc-800" : "hover:bg-zinc-800/60"
                      }`}
                    >
                      <div
                        className={`w-7 h-7 rounded-lg flex items-center justify-center ${
                          isDone ? "bg-cyan-500/20 text-cyan-400" : "bg-zinc-800 text-zinc-400"
                        }`}
                      >
                        {isDone ? <Icon name="check" size={14} /> : <span className="text-xs font-bold">{mod.number}</span>}
                      </div>
                      <span className="text-sm font-medium">{mod.shortTitle}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </>
      );
    }

    function ModuleContent({ module, isCompleted, onToggleComplete, onToast }) {
      if (!module) return null;

      const renderSection = (section, idx) => {
        if (section.type === "text") {
          return (
            <div key={idx} className="mb-6">
              <h3 className="text-lg font-semibold text-zinc-100 mb-2">{section.title}</h3>
              {section.body.split("\n").map((line, i) => (
                <p key={i} className="text-zinc-300 leading-relaxed mb-2 whitespace-pre-line">
                  {line}
                </p>
              ))}
            </div>
          );
        }
        if (section.type === "table") {
          return <DataTable key={idx} title={section.title} headers={section.headers} rows={section.rows} />;
        }
        if (section.type === "prompt") {
          return <PromptBlock key={idx} title={section.title} code={section.code} />;
        }
        if (section.type === "calculator") {
          return <RPMCalculator key={idx} />;
        }
        return null;
      };

      return (
        <article className="max-w-3xl mx-auto">
          <div className="mb-8">
            <div className="flex items-center gap-2 text-sm text-zinc-500 mb-2">
              <span className="px-2 py-0.5 rounded-md bg-zinc-800 text-zinc-400 font-medium">
                Módulo {module.number}
              </span>
              {isCompleted && (
                <span className="flex items-center gap-1 text-cyan-400 text-xs font-medium">
                  <Icon name="check-circle" size={14} /> Concluído
                </span>
              )}
            </div>
            <h2 className="text-2xl sm:text-3xl font-bold text-zinc-50 mb-2">{module.title}</h2>
            <p className="text-zinc-400">{module.description}</p>
          </div>

          <div className="prose-dark">
            <p className="text-zinc-300 leading-relaxed mb-6 text-base">{module.content.intro}</p>
            {module.content.sections.map(renderSection)}
          </div>

          <div className="mt-10 pt-6 border-t border-zinc-800 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p className="text-sm text-zinc-500">
              {isCompleted ? "Você já concluiu este módulo." : "Marque como concluído para acompanhar seu progresso."}
            </p>
            <button
              onClick={() => {
                onToggleComplete(module.id);
                onToast(isCompleted ? "Módulo desmarcado" : "Módulo marcado como concluído!");
              }}
              className={`flex items-center gap-2 px-5 py-2.5 rounded-xl font-medium text-sm transition-all ${
                isCompleted
                  ? "bg-zinc-800 text-zinc-300 hover:bg-zinc-700 border border-zinc-700"
                  : "bg-gradient-to-r from-red-600 to-red-500 text-white hover:from-red-500 hover:to-red-400 shadow-lg shadow-red-900/30"
              }`}
            >
              <Icon name={isCompleted ? "rotate-ccw" : "check"} size={16} />
              {isCompleted ? "Desmarcar" : "Marcar como Concluído"}
            </button>
          </div>
        </article>
      );
    }

    // ========== APP PRINCIPAL ==========
    function App() {
      const [progress, setProgress] = useState(loadProgress);
      const [mobileOpen, setMobileOpen] = useState(false);
      const [toast, setToast] = useState(null);

      const currentModule = COURSE_DATA.modules.find((m) => m.id === progress.currentModule) || COURSE_DATA.modules[0];

      useEffect(() => {
        saveProgress(progress);
      }, [progress]);

      const selectModule = (id) => {
        setProgress((p) => ({ ...p, currentModule: id }));
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const toggleComplete = (id) => {
        setProgress((p) => {
          const completed = p.completed.includes(id)
            ? p.completed.filter((c) => c !== id)
            : [...p.completed, id];
          return { ...p, completed };
        });
      };

      const showToast = (msg) => setToast(msg);

      return (
        <div className="min-h-screen flex flex-col lg:flex-row">
          <MobileNav
            modules={COURSE_DATA.modules}
            currentId={progress.currentModule}
            completed={progress.completed}
            onSelect={selectModule}
            open={mobileOpen}
            setOpen={setMobileOpen}
          />

          <Sidebar
            modules={COURSE_DATA.modules}
            currentId={progress.currentModule}
            completed={progress.completed}
            onSelect={selectModule}
          />

          <main className="flex-1 min-w-0">
            {/* Hero / Header da página */}
            <div className="border-b border-zinc-800 bg-gradient-to-b from-zinc-900/80 to-zinc-950 px-4 sm:px-8 py-8 sm:py-10">
              <div className="max-w-3xl mx-auto">
                <h1 className="text-2xl sm:text-3xl font-extrabold text-zinc-50 tracking-tight">
                  {COURSE_DATA.title}
                </h1>
                <p className="mt-2 text-zinc-400 text-sm sm:text-base">{COURSE_DATA.subtitle}</p>
                <div className="mt-5 lg:hidden">
                  <ProgressBar completed={progress.completed.length} total={COURSE_DATA.modules.length} />
                </div>
              </div>
            </div>

            <div className="px-4 sm:px-8 py-8 sm:py-10">
              <ModuleContent
                module={currentModule}
                isCompleted={progress.completed.includes(currentModule.id)}
                onToggleComplete={toggleComplete}
                onToast={showToast}
              />
            </div>

            {/* Footer */}
            <footer className="border-t border-zinc-800 px-4 py-6 text-center">
              <p className="text-xs text-zinc-600">
                Curso interativo • Conteúdo educacional sobre canais faceless / dark no YouTube
              </p>
            </footer>
          </main>

          {toast && <Toast message={toast} onClose={() => setToast(null)} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
